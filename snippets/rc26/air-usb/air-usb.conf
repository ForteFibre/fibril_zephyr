# The same functions and the same bus contract as rc26-air.
CONFIG_FIBRIL_NODE_SCHEMA="snippets/rc26/air/schema/air.yaml"

CONFIG_FIBRIL_NODE_ID=34

# The gs_usb class turns itself on from the devicetree node, but the stack it
# needs is an application-level choice and stays explicit.
CONFIG_USB_DEVICE_STACK_NEXT=y

# Quieter by default; switch to _DBG when chasing an enumeration failure.
CONFIG_UDC_DRIVER_LOG_LEVEL_WRN=y
CONFIG_USBD_LOG_LEVEL_WRN=y
