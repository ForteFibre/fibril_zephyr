#
# How a MainAir V01 reaches the bus, with nothing about what it does there.
#
# Every RC26 MainAir carries USB CAN, so this snippet is on every build for
# the board and a deployment snippet is layered on top of it:
#
#   west build -b fibril_rc26_mainair_v01 apps/node -S rc26-mainair-usb -S rc26-air
#
# A PC on SocketCAN sees the whole bus, this node's own traffic included,
# through one canX interface: the hub joins the USB-facing external port and
# the CAN0 segment into a single logical bus.

name: rc26-mainair-usb

append:
  EXTRA_CONF_FILE: mainair-usb.conf

boards:
  # A regex, not a bare name: the key is matched against
  # "<board>/<qualifiers>", so an exact-match key never fires on a board that
  # names its SoC.
  /fibril_rc26_mainair_v01.*/:
    append:
      EXTRA_DTC_OVERLAY_FILE: fibril_rc26_mainair_v01.overlay
