#
# RC26 MainAir V01 driving RobStride actuators on the board's CAN1. It carries
# no transport, so it is layered on the board's transport snippet:
#
#   west build -b fibril_rc26_mainair_v01 apps/node -S rc26-mainair-usb -S rc26-robstride
#
# This is the bring-up deployment: one actuator, at the CAN id a RobStride
# ships with. A machine replaces the motor nodes in the overlay with its own
# ids, models and current limits; nothing else in the image changes.

name: rc26-robstride

append:
  EXTRA_CONF_FILE: robstride.conf

boards:
  # A regex, not a bare name: the key is matched against
  # "<board>/<qualifiers>", so an exact-match key never fires on a board that
  # names its SoC.
  /fibril_rc26_mainair_v01.*/:
    append:
      EXTRA_DTC_OVERLAY_FILE: fibril_rc26_mainair_v01.overlay
