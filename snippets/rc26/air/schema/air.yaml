#
# What RC26's pneumatics node exposes on the bus.
#
# `{i}` in the node name is replaced with the node id at startup, so this file
# describes a role rather than one board.

node: rc26_air{i}
protocol: 2

options:
  allocation: static

limits:
  max_frames: 16
  max_copy_entries: 128
  service_buffer: 0
  service_reassembly: 1

# No `types:` here. The application hands the codegen every block type this
# repository implements, alongside this file; the ones this node does not
# instantiate are dropped before the blob is built. A node schema says which
# functions it runs, never what they look like.
instances:
  # Six, matching the outputs the overlay wires. The count is the schema's
  # static ceiling; the application passes the devicetree's actual length at
  # runtime.
  - { type: Solenoid, max_count: 6, ns: "air{i}" }
