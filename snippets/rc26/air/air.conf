CONFIG_FIBRIL_NODE_SCHEMA="snippets/rc26/air/schema/air.yaml"

# 0x20 is this node's slot in RC26's id map. Build-time until the board gains
# a DIP switch or a config ROM in its devicetree.
CONFIG_FIBRIL_NODE_ID=32

# Six valves are wired; the default ceiling of 8 would cost two unused bytes
# of .bss for nothing.
CONFIG_FIBRIL_CAN_NODE_SOLENOID_MAX=6
