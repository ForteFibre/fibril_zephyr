CONFIG_FIBRIL_NODE_SCHEMA="snippets/rc26/odrive/schema/odrive.yaml"

# 0x22, the slot after the RobStride node in RC26's id map. Build-time until
# the board gains a DIP switch or a config ROM in its devicetree.
CONFIG_FIBRIL_NODE_ID=34

# Six axes on one odrive,bus, which is past the driver's default of 4.
CONFIG_MOTOR_ODRIVE_MAX_AXES=6
