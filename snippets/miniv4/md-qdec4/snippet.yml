#
# A RoboMaster Mini V4 as the motor driver CanMotorMbed used to be: four
# RoboMaster motors, each closed around one of the board's quadrature encoder
# inputs, exposed as MdMotor. Layered on a transport snippet:
#
#   west build -b fibril_robomaster_miniv4 apps/node -S miniv4-can -S miniv4-md-qdec4
#
# miniv4-md-<encoder><count>... names the encoders the motors close around,
# in motor order; see doc/apps.md.

name: miniv4-md-qdec4

append:
  EXTRA_CONF_FILE: md-qdec4.conf

boards:
  /fibril_robomaster_miniv4.*/:
    append:
      EXTRA_DTC_OVERLAY_FILE: fibril_robomaster_miniv4.overlay
