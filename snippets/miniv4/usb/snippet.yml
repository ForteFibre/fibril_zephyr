#
# How a RoboMaster Mini V4 reaches the bus, with nothing about what it does
# there. A deployment snippet is layered on top of it:
#
#   west build -b fibril_robomaster_miniv4 apps/node -S miniv4-usb -S miniv4-md-qdec4
#
# A PC on SocketCAN sees the whole fibril_can bus, this node's own traffic
# included, through one canX interface: the hub joins the USB-facing external
# port and the FDCAN1 segment into a single logical bus. Use miniv4-can
# instead when the board sits on the bus without a PC on its USB.

name: miniv4-usb

append:
  EXTRA_CONF_FILE: usb.conf

boards:
  # A regex, not a bare name: the key is matched against
  # "<board>/<qualifiers>", so an exact-match key never fires on a board that
  # names its SoC.
  /fibril_robomaster_miniv4.*/:
    append:
      EXTRA_DTC_OVERLAY_FILE: fibril_robomaster_miniv4.overlay
