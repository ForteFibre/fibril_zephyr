#
# A RoboMaster Mini V4 driving eight RoboMaster motors, each closed around its
# own rotor angle rather than an encoder on the board: CanMotorMbed's
# robomaster_miniv4 build with ROBOMASTER_ENCODER. Layered on a transport
# snippet:
#
#   west build -b fibril_robomaster_miniv4 apps/node -S miniv4-can -S miniv4-md-rotor8

name: miniv4-md-rotor8

append:
  # The role, shared with every board's *-md-* snippet.
  EXTRA_CONF_FILE: ../../common/md/md.conf

boards:
  /fibril_robomaster_miniv4.*/:
    append:
      EXTRA_DTC_OVERLAY_FILE: fibril_robomaster_miniv4.overlay
