#
# A RoboMaster Mini V4 driving four RoboMaster motors, each closed around an
# AMT21x absolute encoder on the board's RS485 bus. Layered on a transport
# snippet:
#
#   west build -b fibril_robomaster_miniv4 apps/node -S miniv4-can -S miniv4-md-amt4
#
# miniv4-md-<encoder><count>... names the encoders the motors close around,
# in motor order; see doc/apps.md.

name: miniv4-md-amt4

append:
  # The role, shared with every board's *-md-* snippet.
  EXTRA_CONF_FILE: ../../common/md/md.conf

boards:
  /fibril_robomaster_miniv4.*/:
    append:
      EXTRA_CONF_FILE: amt21.conf
      EXTRA_DTC_OVERLAY_FILE: fibril_robomaster_miniv4.overlay
