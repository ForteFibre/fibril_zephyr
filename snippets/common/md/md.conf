# Shared by every *-md-* deployment snippet, whatever the board: the role is
# the same, so the schema is too. Boards without an ID switch add their
# CONFIG_FIBRIL_NODE_ID in their own snippet.
CONFIG_FIBRIL_NODE_SCHEMA="snippets/common/md/schema.yaml"

# The board's watchdog, fed by the MdMotor tick (APP_WATCHDOG). A board with
# no watchdog0 alias leaves APP_WATCHDOG off, so this costs it nothing.
CONFIG_WATCHDOG=y
