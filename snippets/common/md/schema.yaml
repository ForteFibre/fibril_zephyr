#
# Who a RoboMaster Mini V4 motor driver is on the bus.
#
# `{i}` in the node name is replaced with the node id at startup, so this file
# describes a role rather than one board. There is no `types:` and no
# `instances:`: the devicetree decides what the node runs.

node: md_controller{i}
protocol: 2

options:
  allocation: static

limits:
  # Eight motors carry 32 topics (target, trajectory, feedback, sensor) and
  # 96 fields. A frame per topic would fill 32 slots exactly, so leave room
  # for the master's frame planner.
  max_frames: 48
  max_copy_entries: 128
  # Every MdMotor service fits a single frame.
  service_buffer: 0
  service_reassembly: 1
