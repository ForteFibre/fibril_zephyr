#
# Who a motor driver (MdMotor, CanMotorMbed's successor) is on the bus, on
# any board.
#
# `{i}` in the node name is replaced with the node id at startup, so this file
# describes a role rather than one board. There is no `types:` and no
# `instances:`: the devicetree decides what the node runs. The limits are
# sized for the largest deployment, eight motors, so a board that drives
# fewer shares them.

node: md_controller{i}
protocol: 2

options:
  allocation: static

limits:
  # The MiniV4 USB/VESC deployment has 400 fields at its maximum instance
  # counts: CanHubDiag (5), CanPortDiag x3 (39), MdMotor x8 (96), VescBus
  # (12), and VescMotor x8 (248). Leave room for future diagnostic fields.
  max_frames: 48
  max_copy_entries: 512
  # Every MdMotor service fits a single frame.
  service_buffer: 0
  service_reassembly: 1
