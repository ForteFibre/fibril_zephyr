#
# This is a Kconfig fragment which can be used to enable debug-related options
# in the application. See the README for more details.

# compiler
CONFIG_DEBUG_OPTIMIZATIONS=y

# logging
CONFIG_LOG=y
CONFIG_APP_LOG_LEVEL_DBG=y

# AMT21 diagnostics. The per-cause counters tell a checksum failure apart from a
# timeout or a framing desync, and the error log keeps the raw bytes that were
# received, which is what makes a dropped response diagnosable at all.
CONFIG_ENCODER_AMT21_STATS=y
CONFIG_ENCODER_AMT21_ERROR_LOG_SIZE=16
