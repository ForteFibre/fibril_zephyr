# This file contains selected Kconfig options for the application.

CONFIG_SENSOR=y
CONFIG_BLINK=y
CONFIG_MOTOR=y
CONFIG_ENCODER=y

# The AMT21 transport keeps reception permanently enabled through the
# asynchronous UART API, which is backed by DMA on STM32.
CONFIG_UART_ASYNC_API=y

CONFIG_LOG=y
# CONFIG_USB_DRIVER_LOG_LEVEL_ERR=y
# CONFIG_USB_DEVICE_LOG_LEVEL_ERR=y
# CONFIG_USB_DEVICE_GS_USB_LOG_LEVEL_DBG=y
# CONFIG_CANNECTIVITY_LOG_LEVEL_DBG=y

# CONFIG_USB_DEVICE_STACK=y
# CONFIG_USB_DEVICE_BOS=y
# CONFIG_USB_DEVICE_INITIALIZE_AT_BOOT=n

CONFIG_CAN=y
CONFIG_CAN_FD_MODE=y
CONFIG_LTO=y
CONFIG_ISR_TABLES_LOCAL_DECLARATION=y
