name: Build

on:
  push:
  pull_request:
  schedule:
    - cron: "0 0 * * *"

permissions:
  contents: read

jobs:
  build:
    name: Build app and tests
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          path: example-application
          persist-credentials: false

      - name: Generate token for private modules
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.FIBRIL_CI_APP_CLIENT_ID }}
          private-key: ${{ secrets.FIBRIL_CI_APP_PRIVATE_KEY }}
          owner: ForteFibre
          repositories: |
            fibril_can
            fibril_common
          # Least-privilege: west update only needs to clone the module. The
          # matching GitHub App installation must expose Contents: read.
          permission-contents: read

      - name: Configure git to use App token for ForteFibre repos
        shell: bash
        env:
          GH_APP_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          git config --global url."https://x-access-token:${GH_APP_TOKEN}@github.com/ForteFibre/".insteadOf "https://github.com/ForteFibre/"

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: 3.12

      - name: Setup Zephyr project
        uses: zephyrproject-rtos/action-zephyr-setup@v1
        with:
          app-path: example-application
          toolchains: arm-zephyr-eabi
          ccache-cache-key: ${{ matrix.os }}

      - name: Build firmware
        working-directory: example-application
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            EXTRA_TWISTER_FLAGS="--short-build-path -O/tmp/twister-out"
          fi
          west twister -T app -v --inline-logs --integration $EXTRA_TWISTER_FLAGS

      # apps/ needs the fcan_codegen CLI. There is no ROS 2 here, so build it
      # with plain CMake from the fibril_can that west.yml pins, which keeps
      # the codegen and the runtime at the same version. Windows is skipped:
      # it has no package manager step for protobuf and yaml-cpp yet.
      - name: Install codegen dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            protobuf-compiler libprotobuf-dev libyaml-cpp-dev ninja-build

      - name: Install codegen dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install protobuf yaml-cpp ninja

      - name: Build fcan_codegen
        if: runner.os != 'Windows'
        shell: bash
        run: |
          cmake -S modules/lib/fibril_can/fibril_can_codegen/standalone \
            -B build/fcan_codegen -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build/fcan_codegen
          echo "FCAN_CODEGEN=$PWD/build/fcan_codegen/fcan_codegen" >> "$GITHUB_ENV"

      - name: Build apps
        if: runner.os != 'Windows'
        working-directory: example-application
        shell: bash
        run: west twister -T apps -v --inline-logs --integration

      - name: Twister Tests
        working-directory: example-application
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            EXTRA_TWISTER_FLAGS="--short-build-path -O/tmp/twister-out"
          fi
          west twister -T tests -v --inline-logs --integration $EXTRA_TWISTER_FLAGS
