CONFIG_ZTEST=y
CONFIG_EMUL=y
CONFIG_SERIAL=y
CONFIG_UART_EMUL=y
CONFIG_UART_ASYNC_API=y
CONFIG_ENCODER=y
CONFIG_LOG=y
CONFIG_ENCODER_LOG_LEVEL_INF=y

# The protocol works in tens of microseconds. With the default 100 Hz tick every
# sub-tick timeout would be rounded up to 10 ms, so the emulated bus would run
# thousands of times slower than the real one and the timing would be meaningless.
CONFIG_SYS_CLOCK_TICKS_PER_SEC=100000
