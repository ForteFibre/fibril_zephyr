CONFIG_ZTEST=y
CONFIG_EMUL=y
CONFIG_SERIAL=y
CONFIG_UART_EMUL=y
CONFIG_IMU=y
CONFIG_LOG=y
CONFIG_IMU_LOG_LEVEL_INF=y

# The stale and offline thresholds are tens of milliseconds. At the default
# 100 Hz tick every short sleep in the tests would round up to 10 ms and add
# up past them.
CONFIG_SYS_CLOCK_TICKS_PER_SEC=1000
