manifest:
  self:
    west-commands: scripts/west-commands.yml

  remotes:
    - name: zephyrproject-rtos
      url-base: https://github.com/zephyrproject-rtos

  projects:
    - name: zephyr
      remote: zephyrproject-rtos
      revision: v4.4.1
      import:
        # By using name-allowlist we can clone only the modules that are
        # strictly needed by the application.
        name-allowlist:
          - cmsis_6 # required by the ARM port for Cortex-M
          - cmsis-dsp
          - hal_stm32 # required by the nucleo_f302r8 board (STM32 based)
    - name: cannectivity
      url: https://github.com/CANnectivity/cannectivity.git
      revision: v1.4.0
      path: modules/third_party/cannectivity
    - name: fibril_can
      # Pinned, not tracking main: the codegen's block-array order is part of
      # the wire contract, and a change to it silently reassigns the counts an
      # application passes in fcan_config_t::instance_counts. Bump this
      # deliberately, together with any migration the release notes call for.
      #
      # v0.4.0 cuts the slave's RAM, Flash and stack (fibril_can#79): a schema
      # with service_buffer 0 now drops the segmentation code from the image
      # here too, FRAME_DEFINE no longer needs ~400 B of ISR stack, and the
      # codegen caps max_copy_entries by the topics' field count. It also makes
      # the router forget only the targeted node's std IDs on a DISCOVER, and
      # shares the router/hub driver code. The breaking change is in the
      # embedded master only, which nothing here uses. The v0.3.7 codegen
      # still works with it; the v0.4.0 codegen is what brings the smaller
      # generated code and the copy-entry cap.
      #
      # v0.3.7 ends an ACCEPTED call on the node's state instead of a timeout
      # (fibril_can ADR-0018): the call handle carries an epoch the runtime
      # stamps, which MdMotor's trigger relies on. The generated dispatchers
      # build handles through the runtime, so the codegen has to be v0.3.7
      # too; an older one compiles but every deferred reply goes stale.
      #
      # v0.3.5 adds the CanPortDiag and CanHubDiag block types
      # (zephyr/schema/can_diag.yaml) and the helpers that read a controller's
      # health and a hub's counters from a tick (can_diag.h, and
      # fcan_hub_zephyr_get_diag / _peer* in can_hub.h), which the can_diag
      # function publishes. The runtime and the codegen are unchanged from
      # v0.3.4.
      #
      # v0.3.4 lets fcan_state be read from a thread that does not run
      # fcan_poll (#66), which is what fibril_fcan_node_state() relies on when a
      # tick runs behind a hub. It keeps, from v0.3.3, fcan_svc_complete staging
      # the reply for the next fcan_poll (#64), so MdMotor can finish
      # calibrate_current_baseline from the tick behind a hub, and *_complete
      # returning FCAN_E_BUSY when no slot is free; and read_<topic>(seq) from
      # v0.3.2 (#61), which MdMotor uses to apply only the commands that newly
      # arrived. The codegen package must be at least v0.3.3: an older
      # fcan_codegen emits a *_complete that returns nothing, and apps/node with
      # MdMotor fails to compile. v0.3.4 changes the runtime only.
      revision: v0.4.0
      url: https://github.com/ForteFibre/fibril_can.git
      path: modules/lib/fibril_can
    - name: fibril_common
      # ROS 2 側と共通の C++17 ライブラリ。CONFIG_FIBRIL_COMMON が立つまで
      # 何もビルドしないので、載せているだけではイメージに現れない。
      #
      # タグではなくコミットなのは、Zephyr module の入口（fibril_common #69）
      # を含むタグがまだ無いため。1.0.19 はそれより前を指している。
      #
      # #74 の -Wdouble-promotion の修正を含む。これより前の版では、
      # CONFIG_FIBRIL_COMMON を立てたビルドが twister の -Werror で止まる。
      revision: 8f336f4838694dc20b52f15b3385573e74af01c8
      url: https://github.com/ForteFibre/fibril_common.git
      path: modules/lib/fibril_common
