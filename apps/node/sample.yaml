#
# One scenario per image that gets flashed. Two snippets name a node: the
# board's transport snippet says how it reaches the bus, the deployment
# snippet says who it is and what it drives.

sample:
  name: fibril_can node
  description: >-
    fibril_can slave. Which block types it carries comes from the
    fibril,fcan-* nodes in its devicetree; the application itself names none
    of them.

common:
  build_only: true
  # Codegen needs the fcan_codegen CLI. It is found automatically where the
  # ros-jazzy-fibril-can-codegen package is installed; elsewhere set it in the
  # environment, which is what reaches the helper:
  #   FCAN_CODEGEN=/abs/path/fcan_codegen west twister -T apps
  # twister's --extra-args=-DFCAN_CODEGEN=... does not.
  filter: CONFIG_FIBRIL_CAN
  platform_allow:
    - fibril_rc26_mainair_v01
  integration_platforms:
    - fibril_rc26_mainair_v01

tests:
  app.node.rc26_air:
    tags:
      - fibril_can
      - can
      - hub
      - usb
    # Semicolons, not two SNIPPET= entries: twister turns each extra_args
    # entry into one -D, and CMake reads SNIPPET as a list.
    extra_args:
      - SNIPPET=rc26-mainair-usb;rc26-air
