#
# One scenario per image that gets flashed. The board and the snippet together
# name a node: the snippet says which functions and which schema, the board
# says which silicon.

sample:
  name: fibril_can node
  description: >-
    fibril_can slave. Which block types it carries comes from the node schema
    a snippet selects; the application itself names none of them.

common:
  build_only: true
  # Codegen needs the fcan_codegen CLI. It is found automatically where the
  # ros-jazzy-fibril-can-codegen package is installed; elsewhere set it in the
  # environment, which is what reaches the helper:
  #   FCAN_CODEGEN=/abs/path/fcan_codegen west twister -T apps
  # twister's --extra-args=-DFCAN_CODEGEN=... does not.
  filter: CONFIG_FIBRIL_CAN

tests:
  app.node.rc26_air:
    tags:
      - fibril_can
      - can
    extra_args:
      - SNIPPET=rc26-air
    platform_allow:
      - fibril_rc26_mainair_v01
    integration_platforms:
      - fibril_rc26_mainair_v01

  app.node.rc26_air_chain:
    tags:
      - fibril_can
      - can
      - hub
    # Same functions and same schema as rc26_air; only the transport differs.
    # Kept as a scenario so the hub backend does not rot untested.
    extra_args:
      - SNIPPET=rc26-air-chain
    platform_allow:
      - fibril_rc26_mainair_v01
    integration_platforms:
      - fibril_rc26_mainair_v01
