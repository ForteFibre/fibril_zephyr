#
# What every fibril_can slave needs. The per-robot half (which schema, which
# node id, which valves, which CAN bus) comes from a snippet.

CONFIG_FIBRIL_CAN=y
CONFIG_FIBRIL_CAN_NODE=y
CONFIG_FCAN_TRANSPORT=y

# The generated wrapper and the functions are C++17. A full standard library
# is not a preference: the wrapper's service registration is std::function and
# its topic readers are std::optional, neither of which MINIMAL_LIBCPP has.
CONFIG_CPP=y
CONFIG_STD_CPP17=y
CONFIG_REQUIRES_FULL_LIBCPP=y

# main.c uses the scheduler_wait / drain_rx / fcan_poll triple; the wake bits
# come from notify_tx_pending, RX enqueue, TX complete, and the 1 ms k_timer
# that bounds the function ticks.
CONFIG_FCAN_ZEPHYR_EVENT_WAKE=y

CONFIG_CAN=y
CONFIG_CAN_FD_MODE=y

# boot_id is the ID-conflict tiebreaker and the T_listen jitter seed, so two
# boards coming up together must not draw the same value.
CONFIG_ENTROPY_GENERATOR=y

CONFIG_HEAP_MEM_POOL_SIZE=4096
CONFIG_MAIN_STACK_SIZE=4096

CONFIG_LOG=y
