description: |
  RobStride actuators exposed on the CAN bus as the schema's RobstrideMotor
  block type.

  This node is what puts RobstrideMotor on the bus. The build reads it to emit
  the schema's `instances:` entry, so describing the wiring is the whole of
  adding the function to an image; there is no second list to keep in step.

  One node covers every actuator the board drives. Each entry of `motors`
  becomes one schema instance, in the order written, so instance 0 on the bus
  is the first phandle here. The order is the contract with the ROS side;
  reordering the list renames every joint.

    fcan_robstride: fcan-robstride {
        compatible = "fibril,fcan-robstride";
        fcan-ns = "joint{i}";
        motors = <&joint_knee>, <&joint_hip>;
        status = "okay";
    };

  The actuators themselves stay where the driver expects them, as
  `robstride,motor` children of a `robstride,bus` node. This node only says
  which of them the bus should see and in what order, so a motor that is
  wired but deliberately not exposed is simply left out of `motors`.

  What the bus can command is decided there too. `max-current-ma` on the motor
  is the full-scale value a `fibril_control_msgs/msg/Target` of type DUTY is
  measured against, so a deployment that leaves it at the model limit gives
  DUTY a much coarser meaning than the ROS 2 original did.

  This node carries no reg and there is no reason to have two of them. The
  implementation reads the first enabled node only, so a second one is a build
  error rather than a silently ignored list of actuators.

compatible: "fibril,fcan-robstride"

include: base.yaml

properties:
  fcan-ns:
    type: string
    required: true
    description: |
      The instance namespace on the bus, which becomes the ROS name prefix.
      `{i}` expands to the instance index, so `joint{i}` gives joint0..jointN.

      It is required unless CONFIG_FIBRIL_CAN_NODE_ROBSTRIDE_MAX is 1 — the
      rule is keyed on that ceiling, not on how many actuators are wired, so
      the default requires it even for a lone motor. The codegen rejects a
      namespace that lacks it, so this is a build error, not a collision
      discovered on the ROS graph.

      Required rather than defaulted: a name that reaches the ROS graph
      belongs to the robot, not to the binding.

  motors:
    type: phandles
    required: true
    description: |
      One `robstride,motor` node per actuator, in bus-instance order.

      The count has to fit CONFIG_FIBRIL_CAN_NODE_ROBSTRIDE_MAX, which is the
      static ceiling the generated code allocates for. CMake cannot read a
      phandle list, so the ceiling is a Kconfig value rather than this length;
      a BUILD_ASSERT in the implementation catches an overflow.
