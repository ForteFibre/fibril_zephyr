description: |
  Solenoid valve outputs exposed on the CAN bus as the schema's Solenoid block
  type.

  This node is what puts Solenoid on the bus. The build reads it to emit the
  schema's `instances:` entry, so describing the hardware is the whole of
  adding the function to an image; there is no second list to keep in step.

  One node describes every valve the board drives. Each entry of `gpios` becomes
  one schema instance, in the order written, so instance 0 on the bus is the
  first phandle here. The order is the contract with the ROS side and with the
  wiring diagram; reordering the list renames every valve.

    fcan_solenoid: fcan-solenoid {
        compatible = "fibril,fcan-solenoid";
        fcan-ns = "air{i}";
        gpios = <&gpioa 1 GPIO_ACTIVE_HIGH>,
                <&gpioa 6 GPIO_ACTIVE_HIGH>;
        status = "okay";
    };

  This node carries no reg and there is no reason to have two of them. The
  implementation reads the first enabled node only, so a second one is a
  build error rather than a silently ignored list of valves.

compatible: "fibril,fcan-solenoid"

include: base.yaml

properties:
  fcan-ns:
    type: string
    required: true
    description: |
      The instance namespace on the bus, which becomes the ROS name prefix.
      `{i}` expands to the instance index, so `air{i}` gives air0..airN.

      It is required unless CONFIG_FIBRIL_CAN_NODE_SOLENOID_MAX is 1 — the
      rule is keyed on that ceiling, not on how many valves are wired, so
      the default of 8 requires it even for a lone valve. The codegen
      rejects a namespace that lacks it, so this is a build error, not a
      collision discovered on the ROS graph.

      Required rather than defaulted: a name that reaches the ROS graph
      belongs to the robot, not to the binding.

  gpios:
    type: phandle-array
    required: true
    description: |
      One entry per valve, in bus-instance order. Active level belongs here
      rather than in the driver: a board may switch the load high-side or
      low-side, and only the schematic says which.

      The count has to fit CONFIG_FIBRIL_CAN_NODE_SOLENOID_MAX, which is the
      static ceiling the generated code allocates for. CMake cannot read a
      phandle-array, so the ceiling is a Kconfig value rather than this
      length; a BUILD_ASSERT in the implementation catches an overflow.
