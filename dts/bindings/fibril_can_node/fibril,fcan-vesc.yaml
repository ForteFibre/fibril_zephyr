description: |
  Runtime VESC assignment and diagnostics. motors must contain the fixed eight
  vesc,motor logical slots in slot order. VescMotor instances are named by
  fcan-ns; one VescBus instance is named vesc_node.bus.
compatible: "fibril,fcan-vesc"
include: base.yaml
properties:
  fcan-ns:
    type: string
    required: true
  motors:
    type: phandles
    required: true
    description: Exactly eight vesc,motor logical slots in slot order.
