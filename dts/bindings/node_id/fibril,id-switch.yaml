description: |
  A rotary or DIP switch that sets which unit a board is, read once at boot.

  The switch's bits are listed in `gpios`, least significant first, and read
  as one unsigned number. Give each GPIO the flags that make a set bit read
  as active, which on a switch that pulls to ground is
  (GPIO_PULL_UP | GPIO_ACTIVE_LOW).

    rotary_id: rotary-id {
        compatible = "fibril,id-switch";
        gpios = <&gpioc 0 (GPIO_PULL_UP | GPIO_ACTIVE_LOW)>,
                <&gpioc 1 (GPIO_PULL_UP | GPIO_ACTIVE_LOW)>,
                <&gpioe 3 (GPIO_PULL_UP | GPIO_ACTIVE_LOW)>,
                <&gpioe 2 (GPIO_PULL_UP | GPIO_ACTIVE_LOW)>;
    };

  A board points `chosen { fibril,node-id = ...; }` at the switch when the
  switch is what gives the fibril_can node its id; lib/node_id reads it.

compatible: "fibril,id-switch"

include: base.yaml

properties:
  gpios:
    type: phandle-array
    required: true
    description: |
      One GPIO per bit, least significant bit first. At most 7, since a
      fibril_can node id is 7 bits wide.
