# --- fibril_can slave runtime + hub driver
CONFIG_FIBRIL_CAN=y
CONFIG_CAN=y
CONFIG_CAN_FD_MODE=y
CONFIG_CAN_FCAN_HUB=y

# --- event-driven scheduler wake for fcan_zephyr_can_hal. This sample drives
#     fcan_poll(self) through the hub thread (no fcan_zephyr_can_hal
#     instance), so the option has no runtime effect here; kept aligned with
#     the other fibril_can samples so the switch is uniform across the tree.
CONFIG_FCAN_ZEPHYR_EVENT_WAKE=y

# --- entropy for boot_id (used as ID-conflict tiebreaker + T_listen jitter
#     seed). Mini V1 has the on-chip RNG; overlay enables it.
CONFIG_ENTROPY_GENERATOR=y

# --- runtime allocation. K_HEAP_DEFINE in main.c carves its own arena, but
#     leave a small system heap for the CAN / USB / RNG drivers.
CONFIG_HEAP_MEM_POOL_SIZE=4096
CONFIG_MAIN_STACK_SIZE=4096

# --- kernel tick precision. 10 kHz gives the sleep_until path 100 μs
#     granularity, which matches the §5 hot-path budget (echo commit dwell
#     ≤ 100 μs @ 1 kHz tick). native_sim defaults to 100 Hz otherwise.
CONFIG_SYS_CLOCK_TICKS_PER_SEC=10000

# --- USB device stack next + CANnectivity's gs_usb class. CONFIG_USBD_GS_USB
#     defaults to y whenever a "gs_usb" DT node is enabled, but state it
#     explicitly so the sample's intent is grep-able.
CONFIG_USB_DEVICE_STACK_NEXT=y
CONFIG_USBD_GS_USB=y

# Quieter USB stack -- switch the two lines below to _DBG when debugging USB
# enumeration failures on real hardware.
CONFIG_UDC_DRIVER_LOG_LEVEL_WRN=y
CONFIG_USBD_LOG_LEVEL_WRN=y
CONFIG_USBD_GS_USB_LOG_LEVEL_INF=y

# --- logging
CONFIG_LOG=y
CONFIG_LOG_MODE_IMMEDIATE=y
CONFIG_BOOT_BANNER=y
