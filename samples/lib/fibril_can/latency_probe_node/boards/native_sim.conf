#
# native_sim has no hardware entropy source. CONFIG_TEST_RANDOM_GENERATOR
# gives sys_rand32_get() a predictable PRNG so the sample boots on this
# platform. Confined to native_sim so the deterministic seed never leaks
# into a physical-board build (boot_id would become predictable).
CONFIG_TEST_RANDOM_GENERATOR=y
