# --- fibril_can slave runtime
CONFIG_FIBRIL_CAN=y

# --- CAN driver + FD framing (mandatory per firmware-requirements §9).
CONFIG_CAN=y
CONFIG_CAN_FD_MODE=y

# --- entropy for boot_id (SPEC §5.3 T_listen jitter seed + ID conflict tiebreaker).
CONFIG_ENTROPY_GENERATOR=y

# --- runtime allocation. K_HEAP_DEFINE in main.c carves its own arena; the
#     system pool covers the CAN driver / entropy driver's startup allocations.
CONFIG_HEAP_MEM_POOL_SIZE=4096

# --- main thread runs the 1 kHz probe tick (drain_rx -> on_tick -> fcan_poll).
CONFIG_MAIN_STACK_SIZE=4096

# --- kernel tick precision. 10 kHz gives the sleep_until path 100 μs
#     granularity, which matches the §5 hot-path budget (echo commit dwell
#     ≤ 100 μs @ 1 kHz tick). native_sim defaults to 100 Hz otherwise.
CONFIG_SYS_CLOCK_TICKS_PER_SEC=10000

# --- logging: no LOG in the hot path (see main.c status thread), so IMMEDIATE
#     mode is safe. Kept on so the initial banner and state-transition print
#     from the low-priority status thread are visible.
CONFIG_LOG=y
CONFIG_LOG_MODE_IMMEDIATE=y
CONFIG_BOOT_BANNER=y
