#
# native_sim has no hardware entropy source. The fake_entropy driver, enabled
# by CONFIG_TEST_RANDOM_GENERATOR, gives sys_rand32_get() a predictable PRNG
# so the sample boots on this platform. Keep this OFF on real boards -- SPEC
# §5.3 uses boot_id as an ID-conflict tiebreaker, and a predictable seed
# defeats it.
CONFIG_TEST_RANDOM_GENERATOR=y
