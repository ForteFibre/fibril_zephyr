sample:
  name: fibril_can codegen slave node
  description: >-
    Bring up a fibril_can slave whose typed wrappers are generated at build
    time by fcan_codegen from the shared example schema. Uses zephyr,can-loopback
    on native_sim so the sample runs without extra hardware. Real deployments
    swap the DTS for an on-chip FDCAN controller.

tests:
  sample.lib.fibril_can.example_node:
    tags:
      - fibril_can
      - can
    # dt_chosen_enabled() gates on the base board providing a zephyr,canbus
    # chosen node. CONFIG_FIBRIL_CAN gates on the fibril_can module being on
    # the west manifest.
    filter: CONFIG_FIBRIL_CAN and dt_chosen_enabled("zephyr,canbus")
    harness: console
    harness_config:
      type: multi_line
      ordered: true
      regex:
        - "fcan_example_node: fcan_init OK"
        - "fcan_example_node: fcan_register_all OK"
        - "fcan_example_node: entering main loop"
    integration_platforms:
      - native_sim
      - fibril_robomaster_miniv1
    # Twister needs to know where fcan_codegen lives before it can build this
    # sample. Set FCAN_CODEGEN in the environment before invoking twister:
    #   FCAN_CODEGEN=/abs/path/fcan_codegen twister -T fibril_zephyr/samples/lib/fibril_can/example_node
    # or pass --extra-args=-DFCAN_CODEGEN=... to twister directly.
