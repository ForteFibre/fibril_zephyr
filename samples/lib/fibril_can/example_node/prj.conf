# SPDX-License-Identifier: Apache-2.0

# --- fibril_can slave runtime
CONFIG_FIBRIL_CAN=y

# --- CAN driver + FD framing.
#     The per-driver MAX_FILTERS Kconfig defaults to 5 for zephyr,can-loopback
#     (see drivers/can/Kconfig.loopback). Two accept-all filters cover std +
#     ext, which fits comfortably. Real boards will need to bump the
#     corresponding CAN_<driver>_MAX_FILTERS in their board.conf.
CONFIG_CAN=y
CONFIG_CAN_FD_MODE=y

# --- entropy for boot_id (§5.4 uses it as ID-conflict tiebreaker + T_listen
#     jitter seed). On native_sim the fake_entropy driver is enabled by
#     CONFIG_ENTROPY_GENERATOR + CONFIG_TEST_RANDOM_GENERATOR.
CONFIG_ENTROPY_GENERATOR=y
CONFIG_TEST_RANDOM_GENERATOR=y

# --- runtime allocation. K_HEAP_DEFINE in main.c carves its own arena, but
#     leave a small system heap in case the CAN driver / entropy driver
#     wants one.
CONFIG_HEAP_MEM_POOL_SIZE=4096

# --- stacks: main runs fcan_poll + app_logic + drains the RX msgq at 1 kHz.
CONFIG_MAIN_STACK_SIZE=4096

# --- logging: immediate so we see the state transitions live under native_sim.
CONFIG_LOG=y
CONFIG_LOG_MODE_IMMEDIATE=y
CONFIG_BOOT_BANNER=y
