CONFIG_ENCODER=y

# The AMT21 transport keeps reception permanently enabled through the
# asynchronous UART API, which is backed by DMA on STM32.
CONFIG_UART_ASYNC_API=y

CONFIG_LOG=y

# Print the boot banner and driver init logs on the console. Immediate mode
# processes each LOG_* call synchronously so early messages, before the log
# thread would run, still make it out through the UART.
CONFIG_BOOT_BANNER=y
CONFIG_PRINTK=y
CONFIG_LOG_MODE_IMMEDIATE=y

# Detailed per-cause counters, printed alongside the encoder reading. Trim this
# out if a smaller image matters more than the bus diagnostics.
CONFIG_ENCODER_AMT21_STATS=y

# Interactive commands ("amt21 …") for reading, resetting and dumping the error
# log while the sample is running. Useful when a run degrades over time and you
# want to nudge the encoder without power-cycling the board.
CONFIG_SHELL=y
CONFIG_ENCODER_AMT21_SHELL=y
