CONFIG_ENCODER=y

CONFIG_LOG=y

# Print the boot banner and driver init logs on the console. Immediate mode
# processes each LOG_* call synchronously, so a failure during init still makes
# it out.
CONFIG_BOOT_BANNER=y
CONFIG_PRINTK=y
CONFIG_LOG_MODE_IMMEDIATE=y
