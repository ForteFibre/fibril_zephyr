# SPDX-License-Identifier: Apache-2.0

# Baseline configuration for driving a "fibril,can-router" device from a
# standalone application. The intended production topology hangs a
# CANnectivity gs_usb node off the same device so the uplink lives on USB;
# adding cannectivity is orthogonal to what this sample tests.

CONFIG_CAN=y
CONFIG_CAN_FD_MODE=y
CONFIG_CAN_FCAN_ROUTER=y

CONFIG_LOG=y
CONFIG_LOG_MODE_IMMEDIATE=y
CONFIG_BOOT_BANNER=y
